# NovaTrader CI（P6 工程化）
# 五道门：web 前端（typecheck/lint/test/build+产物校验）、viz 图形回归（P2-12 golden 比对，windows）、
# Tauri 桌面壳冒烟、Go 后端（build/vet/test 全服务，带隔离 PG+NATS 集成）、Python 边车（pyworker/source-worker/broker-gw）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web 前端门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck（vue-tsc）
        run: npm run typecheck
      - name: lint（eslint flat）
        run: npm run lint
      - name: test（vitest）
        run: npm run test
      - name: build（vite，产物含 popout.html）
        run: npm run build:fast
      - name: 校验构建产物
        run: |
          test -f dist/index.html
          test -f dist/popout.html
          ! ls dist/assets | grep -i gallery   # gallery 仅 DEV，不得进生产包

  graphics:
    name: viz 图形回归（P2-12）
    # golden 权威源 = 本镜像：重刷走 graphics-update.yml（workflow_dispatch 同镜像产出后提交）。
    # 镜像 tag 钉死 windows-2025（浮动 latest 会把字体渲染栈静默升级成红线事件）；勿换 ubuntu。
    runs-on: windows-2025
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 安装 Playwright Chromium
        run: npx playwright install chromium
      - name: 字体先决条件断言（Cascadia Code 缺失即 fail-fast，别送去比像素）
        shell: pwsh
        run: |
          $fonts = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts'
          if (-not ($fonts.PSObject.Properties.Name -match 'Cascadia Code')) {
            Write-Error '缺 Cascadia Code：golden 定格态等宽字形钉在它上面（装 Windows Terminal 或换镜像）'
            exit 1
          }
      - name: golden 比对（用例×主题×密度）
        run: npm run test:graphics
      - name: 失败时上传 diff/actual 图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: graphics-diff
          path: web/graphics/test-results/
          retention-days: 7

  tauri-smoke:
    name: Tauri 桌面壳冒烟
    runs-on: windows-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri
      # 冒烟：编译 + capabilities/CSP 校验，不打安装包（--no-bundle）
      - name: tauri build --no-bundle
        run: npm run tauri build -- --no-bundle

  backend:
    name: Go 后端门禁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 隔离 PG 服务容器同时出 5432/15432 两个宿主口：老套件硬编码 127.0.0.1:5432 直连；
      # NT_TEST_PG_PORT 哨兵套件（pkg/params、pkg/appcfg、risk/datahub 集成）合同=「非默认口才跑，
      # 5432 一律 FAIL 不 SKIP」故指向 15432。显式设置让连不上时 FAIL 而不是 SKIP 冒充验收。
      NT_TEST_PG_PORT: "15432"
      # 隔离 NATS 独立测试口（守卫禁止生产 4222，见 pkg/events/bus_test.go）。
      NT_TEST_NATS_URL: "nats://127.0.0.1:14222"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: 启动隔离 NATS（JetStream，禁 4222 生产口）
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.11.4/nats-server-v2.11.4-linux-amd64.tar.gz | tar xz
          ./nats-server-v2.11.4-linux-amd64/nats-server -js -p 14222 &
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/14222) 2>/dev/null && exit 0; sleep 1; done
          echo "nats did not come up" >&2; exit 1
      - name: test（全服务 build/vet/test，隔离 PG+NATS 集成）
        run: go test ./app/... ./pkg/...

  sidecars:
    name: Python 边车门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest
      - name: pyworker 单测（假模块注入，不装第三方依赖）
        run: cd pyworker && python -m pytest -q
      - name: source-worker 单测
        run: cd source-worker && PYTHONPATH=. python -m pytest -q tests/
      - name: broker-gw 单测
        run: cd broker-gw && PYTHONPATH=. python -m pytest -q tests/
