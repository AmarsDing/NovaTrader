syntax = "proto3";

// M09 交易执行。模拟盘在本服务撮合；实盘文件单由 Windows broker-gw 写，本服务不写 CSV。
package api.trade.v1;

import "google/api/annotations.proto";

option go_package = "server/api/trade/v1;v1";

service Trade {
  rpc PlaceOrder(PlaceOrderRequest) returns (Order) {
    option (google.api.http) = {
      post: "/v1/trade/orders"
      body: "*"
    };
  }
  rpc CancelOrder(CancelOrderRequest) returns (Order) {
    option (google.api.http) = {
      post: "/v1/trade/orders/{client_order_id}/cancel"
      body: "*"
    };
  }
  rpc GetOrder(GetOrderRequest) returns (Order) {
    option (google.api.http) = {
      get: "/v1/trade/orders/{client_order_id}"
    };
  }
  rpc ListPositions(ListPositionsRequest) returns (ListPositionsReply) {
    option (google.api.http) = {
      get: "/v1/trade/positions"
    };
  }
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {
      get: "/v1/trade/account"
    };
  }
  // 兼容保留；服务器拒绝公开撮合输入。仅内部行情消费者可驱动模拟成交。
  rpc ApplyBar(ApplyBarRequest) returns (ApplyBarReply) {
    option (google.api.http) = {
      post: "/v1/trade/bars"
      body: "*"
    };
  }
  rpc RollDay(RollDayRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/trade/roll"
      body: "*"
    };
  }
  rpc Reconcile(ReconcileRequest) returns (ReconcileReply) {
    option (google.api.http) = {
      post: "/v1/trade/reconcile"
      body: "*"
    };
  }
  // LIVE 资金基线种子（自身债高危：此前全仓无写入口，LIVE 买单被现金闸恒拒）。
  // 操作员按柜台实际可用资金一次性人工写入并留人核口；基线已存在返回冲突，
  // 其后资金变动只走柜台回报归并与对账链。
  rpc SeedLiveCashBaseline(SeedLiveCashBaselineRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1/trade/live/cash-baseline"
      body: "*"
    };
  }
  // G7 执行通道状态读面：只回服务端真实跟踪的通道（sim；emfile 服务端未接线，不回）。
  rpc GetChannelStatus(GetChannelStatusRequest) returns (ChannelStatusReply) {
    option (google.api.http) = {
      get: "/v1/trade/channel/status"
    };
  }
  // W5a 执行契约：干跑校验 + 估算，不落单不记账。请求体与 PlaceOrderRequest 同形。
  rpc PreviewOrder(PlaceOrderRequest) returns (OrderPreview) {
    option (google.api.http) = {
      post: "/v1/trade/orders/preview"
      body: "*"
    };
  }
}

message PlaceOrderRequest {
  string client_order_id = 1;
  // SIM / LIVE
  string account = 2;
  string symbol = 3;
  string side = 4;
  double price = 5;
  int32 volume = 6;
  // auto / manual。manual 必须带 operator
  string source = 7;
  string operator = 8;
  string signal_id = 9;
  string strategy_version = 10;
  // 兼容保留；公开接口收到该字段会拒绝，不能由客户端制造成交。
  Bar bar = 11;
  // W5a 幂等键：客户端生成的调用级唯一 id（建议 UUID）。同 intent_id 重复提交返回首次
  // 委托结果，不重复下单；服务端按 book+intent_id 持久去重（与 client_order_id 互不替代——
  // 重试允许换新 client_order_id、必须保 intent_id）。
  string intent_id = 12;
  // W5a 参考价：信号基准价（R 倍数提示与偏离检查的锚）。0=缺省，由服务端按规则口径取现价。
  double reference_price = 13;
}

// W5a 干跑回执：校验结论 + 估算读数；accepted=false 时 reasons 逐条说明。
message OrderPreview {
  bool accepted = 1;
  repeated string reasons = 2;
  double estimated_amount = 3;
  double price = 4;
  int32 volume = 5;
  string side = 6;
  string symbol = 7;
  // 委托价相对 reference_price 的偏离百分比；reference_price 缺省时不下发（没取到≠0）。
  optional double price_distance_pct = 8;
}

message Bar {
  double open = 1;
  double high = 2;
  double low = 3;
  int64 volume = 4;
  double limit_up = 5;
  double limit_down = 6;
  double close = 7;
}

message Order {
  string client_order_id = 1;
  string account = 2;
  string symbol = 3;
  string side = 4;
  string status = 5;
  double price = 6;
  int32 volume = 7;
  int32 filled = 8;
  string reason = 9;
  string signal_id = 10;
  string strategy_version = 11;
  // W5a：幂等键与参考价原样回传，客户端按 intent_id 关联重试结果。
  string intent_id = 12;
  double reference_price = 13;
}

message CancelOrderRequest {
  string client_order_id = 1;
}

message GetOrderRequest {
  string client_order_id = 1;
}

message ListPositionsRequest {
  string account = 1;
}

message Position {
  string symbol = 1;
  int32 quantity = 2;
  int32 available = 3;
  double avg_cost = 4;
  double last_price = 5;
}

message ListPositionsReply {
  repeated Position positions = 1;
}

message GetAccountRequest {
  string account = 1;
}

message Account {
  string account = 1;
  double cash = 2;
  double equity = 3;
  double realized_pnl = 4;
  double unrealized_pnl = 5;
  int32 position_count = 6;
  int32 paper_days = 7;
  bool open_halted = 8;
  string halt_reason = 9;
}

message ApplyBarRequest {
  string account = 1;
  string symbol = 2;
  Bar bar = 3;
}

message ApplyBarReply {
  repeated Order orders = 1;
}

message RollDayRequest {
  string account = 1;
}

message RemotePosition {
  string symbol = 1;
  int32 quantity = 2;
  int32 available = 3;
}

message ReconcileRequest {
  string account = 1;
  repeated RemotePosition positions = 2;
}

message ReconcileReply {
  bool matched = 1;
  bool open_halted = 2;
  repeated string diffs = 3;
}

message SeedLiveCashBaselineRequest {
  // 柜台实际可用资金（人工抄录，必须 > 0；绝不自动写入）。
  double available = 1;
  // 操作员（必填，审计留痕）。
  string operator = 2;
  // 来源备注（必填：终端读数/结单口径与时间，供人核回溯）。
  string source_note = 3;
}

message GetChannelStatusRequest {}

// ChannelStatus 是一条执行通道的当前状态（G7 brokerif.Tracker 口径）。
message ChannelStatus {
  // sim | emfile
  string channel = 1;
  // idle | connected | degraded | down
  string status = 2;
  // RFC3339 UTC；初始 idle 取进程启动时刻（brokerif.NewTracker 口径），仅防御性零值为空串。
  string since = 3;
}

message ChannelStatusReply {
  repeated ChannelStatus channels = 1;
}
