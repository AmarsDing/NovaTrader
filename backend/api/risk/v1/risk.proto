syntax = "proto3";

package api.risk.v1;

import "google/api/annotations.proto";

option go_package = "server/api/risk/v1;v1";

// Risk 是 M08 事前风控。trade 下单前调 CheckOrder；客户端经 admin 转调其余接口。
service Risk {
  // 事前校验。调用方超时（建议 200ms）视为拒绝。
  rpc CheckOrder(CheckOrderRequest) returns (CheckOrderReply) {
    option (google.api.http) = {
      post: "/risk/v1/check"
      body: "*"
    };
  }
  // 干跑试算（G7）：与 CheckOrder 同一装配与守卫，但不落单、不占预约、不进审计。
  rpc PreviewOrder(CheckOrderRequest) returns (PreviewOrderReply) {
    option (google.api.http) = {
      post: "/risk/v1/preview"
      body: "*"
    };
  }
  rpc GetState(GetStateRequest) returns (StateReply) {
    option (google.api.http) = {
      get: "/risk/v1/state"
    };
  }
  rpc SetMode(SetModeRequest) returns (StateReply) {
    option (google.api.http) = {
      post: "/risk/v1/mode"
      body: "*"
    };
  }
  rpc TriggerKillSwitch(TriggerKillSwitchRequest) returns (StateReply) {
    option (google.api.http) = {
      post: "/risk/v1/killswitch"
      body: "*"
    };
  }
  // 恢复必须带操作人和确认字样 CONFIRM。恢复后模式仍为 L0。
  rpc ResetKillSwitch(ResetKillSwitchRequest) returns (StateReply) {
    option (google.api.http) = {
      post: "/risk/v1/killswitch/reset"
      body: "*"
    };
  }
  rpc UpdateParam(UpdateParamRequest) returns (StateReply) {
    option (google.api.http) = {
      post: "/risk/v1/params"
      body: "*"
    };
  }
  rpc DailyReport(DailyReportRequest) returns (DailyReportReply) {
    option (google.api.http) = {
      get: "/risk/v1/report"
    };
  }
  // 各项限额的上限与当前使用量（监控驾驶舱 P1，只读）。
  rpc Limits(LimitsRequest) returns (LimitsReply) {
    option (google.api.http) = {
      get: "/risk/v1/limits"
    };
  }
  /* ---------- G3 盯盘价格告警规则：CRUD 与 re-arm ---------- */
  rpc ListAlertRules(ListAlertRulesRequest) returns (AlertRulesReply) {
    option (google.api.http) = {
      get: "/risk/v1/alert/rules"
    };
  }
  rpc CreateAlertRule(CreateAlertRuleRequest) returns (AlertRulesReply) {
    option (google.api.http) = {
      post: "/risk/v1/alert/rules"
      body: "*"
    };
  }
  // 编辑按白名单重建：触发态字段清零、基线重采（防幽灵基线）。
  rpc EditAlertRule(EditAlertRuleRequest) returns (AlertRulesReply) {
    option (google.api.http) = {
      post: "/risk/v1/alert/rules/edit"
      body: "*"
    };
  }
  // 重新布防：同参数白名单重建，触发后可重新响。
  rpc RearmAlertRule(RearmAlertRuleRequest) returns (AlertRulesReply) {
    option (google.api.http) = {
      post: "/risk/v1/alert/rules/rearm"
      body: "*"
    };
  }
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (AlertRulesReply) {
    option (google.api.http) = {
      post: "/risk/v1/alert/rules/delete"
      body: "*"
    };
  }
}

message CheckOrderRequest {
  string client_order_id = 1;
  // SIM / LIVE
  string account_type = 2;
  // 600519.SH
  string symbol = 3;
  // buy / sell
  string side = 4;
  double price = 5;
  int32 volume = 6;
  // auto / watch / manual
  string source = 7;
  // 人工单必填
  string operator = 8;
  string sector = 9;
  optional int32 expected_config_revision = 10;
}

message RuleResult {
  string rule = 1;
  string name = 2;
  bool pass = 3;
  string note = 4;
  int32 volume = 5;
}

message CheckOrderReply {
  bool approved = 1;
  // 放行数量，缩量时小于申报数量
  int32 volume = 2;
  bool adjusted = 3;
  // 拒绝时的规则编号 R00–R15
  string rule = 4;
  string reason = 5;
  repeated RuleResult results = 6;
  int64 latency_us = 7;
}

// PreviewOrderReply 是干跑试算结果：风控逐条结论 + 预计成交金额/费用/现金影响。
message PreviewOrderReply {
  bool approved = 1;
  string block_rule = 2;
  string reason = 3;
  // 风控缩量后的股数
  int32 volume = 4;
  bool adjusted = 5;
  double amount = 6;
  double fee = 7;
  // 买入为 -(amount+fee)，卖出为 +(amount-fee)
  double cash_delta = 8;
  repeated RuleResult results = 9;
}

message GetStateRequest {}

message KillSwitch {
  bool active = 1;
  string source = 2;
  string reason = 3;
  string operator = 4;
  // RFC3339
  string at = 5;
}

message StateReply {
  string mode = 1;
  KillSwitch kill_switch = 2;
  // 账户类型 → 当日锁存的熔断原因
  map<string, string> breakers = 3;
  // 当前市场类熔断原因，空为未触发
  string market_breaker = 4;
  int32 buys_today = 5;
  map<string, string> params = 6;
  // 账户类型 → 最近快照时间
  map<string, string> account_as_of = 7;
  string last_quote_at = 8;
  int64 config_revision = 9; // Successfully loaded immutable configuration version.
  optional bool config_ready = 10; // false after a failed load until actual recovery.
  optional bool ready = 11; // Actual engine readiness; missing on legacy servers means unknown.
}

message SetModeRequest {
  // L0–L3
  string mode = 1;
  string operator = 2;
  string reason = 3;
}

message TriggerKillSwitchRequest {
  // client / reconcile / terminal / market
  string source = 1;
  string reason = 2;
  string operator = 3;
}

message ResetKillSwitchRequest {
  string operator = 1;
  string confirm = 2;
  string reason = 3;
}

message UpdateParamRequest {
  // 带或不带 risk. 前缀
  string key = 1;
  string value = 2;
  string operator = 3;
  optional int64 base_revision = 4; // Required; omitted legacy writes receive 428.
}

message DailyReportRequest {
  // YYYY-MM-DD，空为今天
  string date = 1;
}

message RuleCount {
  string rule = 1;
  string name = 2;
  int32 count = 3;
}

message RiskEventItem {
  string kind = 1;
  bool active = 2;
  string mode = 3;
  string source = 4;
  string reason = 5;
  string operator = 6;
  string at = 7;
}

message DailyReportReply {
  string date = 1;
  int32 checks = 2;
  int32 approved = 3;
  int32 rejected = 4;
  int32 adjusted = 5;
  repeated RuleCount rejects = 6;
  repeated RiskEventItem events = 7;
  int64 p99_latency_us = 8;
}

/* ---------- 监控驾驶舱 P1：限额上限 × 当前用量（只读） ---------- */

message LimitsRequest {
  // SIM / LIVE；空为两本账合计
  string account_type = 1;
}

// LimitItem 一条限额：上限、当前用量、占上限比例（0–1；算不出为 -1）。
message LimitItem {
  string key = 1;        // 参数键（带 risk. 前缀）或规则号
  string name = 2;       // 中文口径，与 R01–R15 链一致处用规则名
  string unit = 3;       // 笔 / 元 / % / 笔每秒
  double limit = 4;      // 上限；-1 表示该限额不适用
  double used = 5;       // 当前用量；-1 表示用量不可得（引擎没有这笔账）
  double ratio = 6;      // used/limit；任一为负则为 -1
  string note = 7;       // 口径说明
}

message LimitsReply {
  string account_type = 1;
  repeated LimitItem items = 2;
}

/* ---------- G3 盯盘价格告警规则 ---------- */

// AlertRule 一条盯盘规则：above/below/crosses 三态，crosses 以 last_price 为基线。
// 触发后转 triggered 不再响；Edit/Rearm 白名单重建后重新 armed。
message AlertRule {
  string id = 1;
  string symbol = 2;
  // above / below / crosses
  string condition = 3;
  double target_price = 4;
  string note = 5;
  // active / triggered
  string status = 6;
  optional double last_price = 7;
  // RFC3339；评估节拍落库
  string armed_at = 8;
  optional string triggered_at = 9;
  string created_at = 10;
  string updated_at = 11;
}

message ListAlertRulesRequest {}

message CreateAlertRuleRequest {
  string symbol = 1;
  string condition = 2;
  double target_price = 3;
  string note = 4;
  string operator = 5;
}

message EditAlertRuleRequest {
  string id = 1;
  string symbol = 2;
  string condition = 3;
  double target_price = 4;
  string note = 5;
  string operator = 6;
}

message RearmAlertRuleRequest {
  string id = 1;
  string operator = 2;
}

message DeleteAlertRuleRequest {
  string id = 1;
  string operator = 2;
}

message AlertRulesReply {
  repeated AlertRule rules = 1;
}
