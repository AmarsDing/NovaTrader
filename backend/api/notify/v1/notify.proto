syntax = "proto3";

package api.notify.v1;

import "google/api/annotations.proto";

option go_package = "server/api/notify/v1;v1";

// Notify 是 M10 通知记录查询。发送由事件驱动，不在这里触发。
// 客户端不直连本服务，以后经 admin 转发。
service Notify {
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesReply) {
    option (google.api.http) = {
      get: "/notify/v1/messages"
    };
  }
  rpc GetMessage(GetMessageRequest) returns (MessageReply) {
    option (google.api.http) = {
      get: "/notify/v1/messages/{id}"
    };
  }
  // MarkRead 通知中心逐条已读回写（前端此前只落 localStorage，逐条已读 id 即消息行 id）。
  // 幂等：只对未读行落 read_at（首读时刻保留），返回实际落行数，重复回写返回 0。
  rpc MarkRead(MarkReadRequest) returns (MarkReadReply) {
    option (google.api.http) = {
      post: "/notify/v1/messages/read"
      body: "*"
    };
  }
}

message ListMessagesRequest {
  int32 limit = 1;
}

message ListMessagesReply {
  repeated MessageReply messages = 1;
}

message GetMessageRequest {
  int64 id = 1;
}

message MarkReadRequest {
  // 行 id 集，上限 500（与前端已读本存容量同口径）；空集/超界/含非正 id 一律拒。
  repeated int64 ids = 1;
}

message MarkReadReply {
  // 本次实际从「未读」翻「已读」的行数（权威行数，非请求数）。
  int64 updated = 1;
}

message MessageReply {
  int64 id = 1;
  string event_id = 2;
  string trace_id = 3;
  string source = 4;
  string subject = 5;
  string category = 6;
  string priority = 7;
  string title = 8;
  string body = 9;
  string dedup_key = 10;
  int32 merge_count = 11;
  string status = 12;
  string rendered = 13;
  string desktop_status = 14;
  int32 desktop_attempts = 15;
  string desktop_error = 16;
  string feishu_status = 17;
  int32 feishu_attempts = 18;
  string feishu_error = 19;
  string created_at = 20;
  string sent_at = 21;
  string read_at = 22;
}
