syntax = "proto3";

package brain.v1;

option go_package = "server/api/brain/v1;v1";

import "google/api/annotations.proto";

// Brain 是 M05 AI 智脑。模型只给评分、理由和证据编号，不给价格，不下单。
service Brain {
  // 单只候选四维研判。模型不可用时返回 rule_score 并标 ai_degraded。
  rpc Analyze(AnalyzeRequest) returns (Analysis) {
    option (google.api.http) = {post: "/v1/brain/analyze" body: "*"};
  }
  // 批量研判，一次最多 30 只。
  rpc AnalyzeBatch(AnalyzeBatchRequest) returns (AnalyzeBatchReply) {
    option (google.api.http) = {post: "/v1/brain/analyze/batch" body: "*"};
  }
  // 生成或重新生成某日晨报。
  rpc GenerateBriefing(GenerateBriefingRequest) returns (Briefing) {
    option (google.api.http) = {post: "/v1/brain/briefing" body: "*"};
  }
  rpc GetBriefing(GetBriefingRequest) returns (Briefing) {
    option (google.api.http) = {get: "/v1/brain/briefing/{date}"};
  }
  // 持仓或候选异动解读。
  rpc Explain(ExplainRequest) returns (Explanation) {
    option (google.api.http) = {post: "/v1/brain/explain" body: "*"};
  }
  // 针对某次研判追问。
  rpc Ask(AskRequest) returns (AskReply) {
    option (google.api.http) = {post: "/v1/brain/ask" body: "*"};
  }
  // 各档模型的延迟、排队和 KV 缓存占用。
  rpc Stats(StatsRequest) returns (StatsReply) {
    option (google.api.http) = {get: "/v1/brain/stats"};
  }
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0; // 按 INTRADAY 处理
  POSITION_RISK = 1;
  INTRADAY = 2;
  BRIEFING = 3;
  NEWS_BATCH = 4;
  REVIEW = 5;
}

// Fact 是一条因子。id 形如 F:close；数值因子填 value，文本因子填 text。
message Fact {
  string id = 1;
  string label = 2;
  double value = 3;
  string unit = 4;
  string text = 5;
  // technical / news / capital / external，空时按 id 前缀推断
  string dim = 6;
}

// Intel 是一条情报。id 形如 N:1024。
message Intel {
  string id = 1;
  string title = 2;
  string body = 3;
  string source = 4;
  string time = 5; // RFC3339
  double sentiment = 6;
}

message AnalyzeRequest {
  string symbol = 1; // 600519.SH
  string name = 2;
  string trace_id = 3;
  Priority priority = 4;
  double rule_score = 5; // 0–100，降级时原样返回
  string phase = 6;      // ICE / RECOVER / WARM / HOT / FADE，空为未知
  repeated Fact facts = 7;
  repeated Intel intel = 8;
  string as_of = 9; // RFC3339，空为当前时刻
}

message Reason {
  string text = 1;
  repeated string evidence = 2;
}

message DimensionScore {
  string dim = 1;
  int32 score = 2;
  repeated Reason reasons = 3;
  repeated string risks = 4;
  string source = 5; // model：模型给出；rule：缺数据时系统给中性分；failed：模型不可用或输出不合格，score 无意义
  string model = 6;
}

message Analysis {
  int64 decision_id = 1;
  string trace_id = 2;
  string symbol = 3;
  repeated DimensionScore dimensions = 4;
  double composite_score = 5; // 降级时等于 rule_score
  double weighted_score = 6;  // 情绪系数之前
  string phase = 7;
  double phase_coef = 8;
  string summary = 9;
  repeated string summary_evidence = 10;
  bool ai_degraded = 11;
  bool discarded = 12;
  string reason = 13; // 降级或丢弃原因
  int64 latency_ms = 14;
  double rule_score = 15;
}

message AnalyzeBatchRequest {
  repeated AnalyzeRequest items = 1;
}

message AnalyzeBatchReply {
  repeated Analysis items = 1;
}

message GenerateBriefingRequest {
  string date = 1; // YYYY-MM-DD，空为今天
}

message GetBriefingRequest {
  string date = 1;
}

message WatchItem {
  string symbol = 1;
  string reason = 2;
  repeated string evidence = 3;
}

message PositionView {
  string symbol = 1;
  string view = 2;
  repeated string evidence = 3;
}

message NewsLine {
  string id = 1;
  string title = 2;
  int32 importance = 3;
  string symbol = 4;
}

message Briefing {
  string date = 1;
  bool degraded = 2;
  string headline = 3;
  string market_view = 4;
  repeated string risks = 5;
  repeated WatchItem watchlist = 6;
  repeated PositionView positions = 7;
  repeated NewsLine news = 8; // 晨报引用的原始情报
  int64 decision_id = 9;
  string created_at = 10;
  string reason = 11;
}

message ExplainRequest {
  string symbol = 1;
  string event = 2; // 异动描述，例如「5 分钟涨 4%」
  bool holding = 3; // 持仓走最高优先级
  string trace_id = 4;
  repeated Fact facts = 5;
}

message Explanation {
  int64 decision_id = 1;
  string summary = 2;
  string impact = 3; // positive / negative / neutral
  repeated string risks = 4;
  repeated string evidence = 5;
  bool ai_degraded = 6;
  bool discarded = 7;
  string reason = 8;
}

message AskRequest {
  int64 decision_id = 1;
  string question = 2;
}

message AskReply {
  int64 decision_id = 1; // 本次追问的记录
  string answer = 2;
  repeated string evidence = 3;
  bool ai_degraded = 4;
  bool discarded = 5;
  string reason = 6;
}

message StatsRequest {}

message TierStats {
  string tier = 1;
  string model = 2;
  bool configured = 3;
  int64 calls = 4;
  int64 failures = 5;
  double p50_ms = 6;
  double p95_ms = 7;
  int32 in_flight = 8;
  int32 queued = 9;
  bool circuit_open = 10;
  double kv_cache_usage = 11; // 0–1，读不到为 -1
  double running = 12;
  double waiting = 13;
}

message StatsReply {
  repeated TierStats tiers = 1;
}
