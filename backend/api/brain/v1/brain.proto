syntax = "proto3";

package brain.v1;

option go_package = "server/api/brain/v1;v1";

import "google/api/annotations.proto";

// Brain 是 M05 AI 智脑。模型只给评分、理由和证据编号，不给价格，不下单。
service Brain {
  // 单只候选四维研判。模型不可用时返回 rule_score 并标 ai_degraded。
  rpc Analyze(AnalyzeRequest) returns (Analysis) {
    option (google.api.http) = {post: "/v1/brain/analyze" body: "*"};
  }
  // 批量研判，一次最多 30 只。
  rpc AnalyzeBatch(AnalyzeBatchRequest) returns (AnalyzeBatchReply) {
    option (google.api.http) = {post: "/v1/brain/analyze/batch" body: "*"};
  }
  // 生成或重新生成某日晨报。
  rpc GenerateBriefing(GenerateBriefingRequest) returns (Briefing) {
    option (google.api.http) = {post: "/v1/brain/briefing" body: "*"};
  }
  rpc GetBriefing(GetBriefingRequest) returns (Briefing) {
    option (google.api.http) = {get: "/v1/brain/briefing/{date}"};
  }
  // 持仓或候选异动解读。
  rpc Explain(ExplainRequest) returns (Explanation) {
    option (google.api.http) = {post: "/v1/brain/explain" body: "*"};
  }
  // 针对某次研判追问。
  rpc Ask(AskRequest) returns (AskReply) {
    option (google.api.http) = {post: "/v1/brain/ask" body: "*"};
  }
  // 各档模型的延迟、排队和 KV 缓存占用。
  rpc Stats(StatsRequest) returns (StatsReply) {
    option (google.api.http) = {get: "/v1/brain/stats"};
  }
  // 令牌用量：prompt/completion/合计，按档聚合（监控驾驶舱 P1，只读）。
  rpc Usage(UsageRequest) returns (UsageReply) {
    option (google.api.http) = {get: "/v1/brain/usage"};
  }
  // 某条信号对应的研判正文摘录（首段 ≤200 字）+ 耗时。
  rpc Reasoning(ReasoningRequest) returns (ReasoningReply) {
    option (google.api.http) = {get: "/v1/brain/reasoning"};
  }
  // 近 1 小时调用延迟直方图（8 桶）。
  rpc LatencyHistogram(LatencyHistogramRequest) returns (LatencyHistogramReply) {
    option (google.api.http) = {get: "/v1/brain/latency-histogram"};
  }
  // 每日/每周复盘。kind=program（默认）八格程序版；kind=ai（P1-7）五段式 AI 复盘；
  // kind=ai_week（P1-7b）AI 周报，date 传该周任意一天，自动对齐到本周最后一个交易日。
  rpc GetProgramReview(GetProgramReviewRequest) returns (ProgramReview) {
    option (google.api.http) = {get: "/v1/brain/review/{date}"};
  }
  // 手动生成/重新生成 AI 复盘：kind 空或 ai = 五段式日复盘（同日覆盖）；
  // kind=ai_week = AI 周报，行落在该周最后一个交易日（P1-7b，同事务发 strategy.review 通知）。
  rpc GenerateAIReview(GenerateAIReviewRequest) returns (ProgramReview) {
    option (google.api.http) = {post: "/v1/brain/review/ai" body: "*"};
  }
  // 收盘定稿读数（情绪冻结存档）。没取到的标量不返回（proto3 optional）。
  rpc GetFrozenEmotion(GetFrozenEmotionRequest) returns (FrozenEmotion) {
    option (google.api.http) = {get: "/v1/brain/emotion-frozen/{date}"};
  }
  // 明日验证对账列表，按对账日倒序。
  rpc ListPredictionChecks(ListChecksRequest) returns (PredictionCheckList) {
    option (google.api.http) = {get: "/v1/brain/prediction-checks"};
  }
  // 补跑某日（对账日）明日验证对账。
  rpc RunPredictionCheck(RunCheckRequest) returns (PredictionCheck) {
    option (google.api.http) = {post: "/v1/brain/prediction-checks/run" body: "*"};
  }
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0; // 按 INTRADAY 处理
  POSITION_RISK = 1;
  INTRADAY = 2;
  BRIEFING = 3;
  NEWS_BATCH = 4;
  REVIEW = 5;
}

// Fact 是一条因子。id 形如 F:close；数值因子填 value，文本因子填 text。
message Fact {
  string id = 1;
  string label = 2;
  double value = 3;
  string unit = 4;
  string text = 5;
  // technical / news / capital / external，空时按 id 前缀推断
  string dim = 6;
}

// Intel 是一条情报。id 形如 N:1024。
message Intel {
  string id = 1;
  string title = 2;
  string body = 3;
  string source = 4;
  string time = 5; // RFC3339
  double sentiment = 6;
}

message AnalyzeRequest {
  string symbol = 1; // 600519.SH
  string name = 2;
  string trace_id = 3;
  Priority priority = 4;
  double rule_score = 5; // 0–100，降级时原样返回
  string phase = 6;      // ICE / RECOVER / WARM / HOT / FADE，空为未知
  repeated Fact facts = 7;
  repeated Intel intel = 8;
  string as_of = 9; // RFC3339，空为当前时刻
}

message Reason {
  string text = 1;
  repeated string evidence = 2;
}

message DimensionScore {
  string dim = 1;
  int32 score = 2;
  repeated Reason reasons = 3;
  repeated string risks = 4;
  string source = 5; // model：模型给出；rule：缺数据时系统给中性分；failed：模型不可用或输出不合格，score 无意义
  string model = 6;
}

message Analysis {
  int64 decision_id = 1;
  string trace_id = 2;
  string symbol = 3;
  repeated DimensionScore dimensions = 4;
  double composite_score = 5; // 降级时等于 rule_score
  double weighted_score = 6;  // 情绪系数之前
  string phase = 7;
  double phase_coef = 8;
  string summary = 9;
  repeated string summary_evidence = 10;
  bool ai_degraded = 11;
  bool discarded = 12;
  string reason = 13; // 降级或丢弃原因
  int64 latency_ms = 14;
  double rule_score = 15;
}

message AnalyzeBatchRequest {
  repeated AnalyzeRequest items = 1;
}

message AnalyzeBatchReply {
  repeated Analysis items = 1;
}

message GenerateBriefingRequest {
  string date = 1; // YYYY-MM-DD，空为今天
}

message GetBriefingRequest {
  string date = 1;
}

message WatchItem {
  string symbol = 1;
  string reason = 2;
  repeated string evidence = 3;
}

message PositionView {
  string symbol = 1;
  string view = 2;
  repeated string evidence = 3;
}

message NewsLine {
  string id = 1;
  string title = 2;
  int32 importance = 3;
  string symbol = 4;
}

// P1-5 数字三档核对留痕：sourced 事实包有出处 / recomputed 算式重算通过 / omitted 无出处已替换为「（略※）」。
message EvidenceItem {
  string field = 1;   // 字段归属：headline / market_view / risks[0] / watchlist.600519 / positions.000002
  string span = 2;    // 正文中的数字 token
  string verdict = 3;
  string match = 4;   // sourced=出处（事实标签或文本片段）；recomputed=算式；omitted 为空
}

message Briefing {
  string date = 1;
  bool degraded = 2;
  string headline = 3;
  string market_view = 4;
  repeated string risks = 5;
  repeated WatchItem watchlist = 6;
  repeated PositionView positions = 7;
  repeated NewsLine news = 8; // 晨报引用的原始情报
  int64 decision_id = 9;
  string created_at = 10;
  string reason = 11;
  repeated EvidenceItem evidence = 12; // P1-5 数字核对明细；核对落地前的旧晨报为空
  optional int32 omitted_count = 13;   // 被替换为「（略※）」的数字个数；旧晨报/降级晨报 = null
}

message ExplainRequest {
  string symbol = 1;
  string event = 2; // 异动描述，例如「5 分钟涨 4%」
  bool holding = 3; // 持仓走最高优先级
  string trace_id = 4;
  repeated Fact facts = 5;
}

message Explanation {
  int64 decision_id = 1;
  string summary = 2;
  string impact = 3; // positive / negative / neutral
  repeated string risks = 4;
  repeated string evidence = 5;
  bool ai_degraded = 6;
  bool discarded = 7;
  string reason = 8;
}

message AskRequest {
  int64 decision_id = 1;
  string question = 2;
  // 追问发起的驾驶舱面板（G5 后端窗口：供追问来源归因与面板级分析；空 = 未标注）。
  string pane = 3;
}

message AskReply {
  int64 decision_id = 1; // 本次追问的记录
  string answer = 2;
  repeated string evidence = 3;
  bool ai_degraded = 4;
  bool discarded = 5;
  string reason = 6;
}

message StatsRequest {}

message TierStats {
  string tier = 1;
  string model = 2;
  bool configured = 3;
  int64 calls = 4;
  int64 failures = 5;
  double p50_ms = 6;
  double p95_ms = 7;
  int32 in_flight = 8;
  int32 queued = 9;
  bool circuit_open = 10;
  double kv_cache_usage = 11; // 0–1，读不到为 -1
  double running = 12;
  double waiting = 13;
}

message StatsReply {
  repeated TierStats tiers = 1;
}

/* ---------- 监控驾驶舱 P1 只读聚合（llm_call_log） ---------- */

message UsageRequest {
  // 聚合窗口：today（默认，自然日）/ 1h / 24h
  string window = 1;
}

message TierUsage {
  string tier = 1;
  string model = 2;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 total_tokens = 5;
  int64 calls = 6;
  int64 failures = 7;
}

message UsageReply {
  string window = 1;
  string since = 2; // RFC3339，窗口起点
  repeated TierUsage tiers = 3;
  TierUsage total = 4;
}

message ReasoningRequest {
  // trade_signals.id；与 decision_id 二选一，signal_id 优先
  int64 signal_id = 1;
  int64 decision_id = 2;
}

message ReasoningReply {
  bool found = 1;           // 没找到对应调用记录时为 false，其余字段为零值
  int64 decision_id = 2;
  string trace_id = 3;
  string excerpt = 4;       // 输出首段，≤200 字
  int64 latency_ms = 5;
  string tier = 6;
  string model = 7;
  string task = 8;
  string created_at = 9;    // RFC3339
}

message LatencyHistogramRequest {
  // 窗口分钟数，默认 60，上限 24*60
  int32 window_minutes = 1;
}

message LatencyBucket {
  double le_ms = 1;   // 桶上沿（毫秒）；最后一桶为 +Inf 语义，回一个很大的数
  int64 count = 2;
}

message LatencyHistogramReply {
  int32 window_minutes = 1;
  int64 total = 2;
  double p50_ms = 3;
  double p95_ms = 4;
  repeated LatencyBucket buckets = 5; // 固定 8 桶
}

/* ---------- 复盘体系：程序版复盘、收盘定稿、明日验证对账 ---------- */

message GetProgramReviewRequest {
  string date = 1; // YYYY-MM-DD；kind=ai_week 时传该周任意一天即可
  string kind = 2; // program（默认）/ ai（P1-7 五段式）/ ai_week（P1-7b 周报）
}

message ProgramReview {
  string date = 1;             // 实际落行的日期（ai_week 对齐到本周最后交易日，可能与请求不同）
  string content = 2;          // program：八格文本；ai/ai_week：汇总段总评
  string stats_json = 3;       // program：八格读数；ai：五段+留痕；ai_week：逐日读数+周聚合+留痕
  repeated string lessons = 4; // ai/ai_week：教训要点；program 为空
  string model = 5;            // ai/ai_week：参与模型（逗号拼接）；program 为空
}

message GenerateAIReviewRequest {
  string date = 1; // YYYY-MM-DD，空为今天；ai_week 时传该周任意一天
  string kind = 2; // 空或 ai = 五段式日复盘；ai_week = 周报
}

message GetFrozenEmotionRequest {
  string date = 1; // YYYY-MM-DD
}

message FrozenEmotion {
  string date = 1;
  optional int32 up_count = 2;
  optional int32 down_count = 3;
  optional int32 broken_count = 4;
  optional double seal_rate = 5;    // %
  optional int32 max_height = 6;
  optional double promo_12 = 7;     // 1进2 晋级率 %
  optional double promo_23 = 8;     // 2进3 晋级率 %
  optional double promo_high = 9;   // 高位晋级率 %
  optional double tier_avg = 10;    // 昨日梯队今日平均涨幅 %
  optional double tier_median = 11;
  optional double tier_red_rate = 12;
  optional double tier_relimit = 13;
  string ladder_json = 14;      // 连板天梯 {height:[{symbol,name,reason,open_count,first_seal_at}]}
  string first_board_json = 15; // 首板名单
  string theme_tree_json = 16;  // 题材归并 top
  string prev_tier_json = 17;   // 昨日梯队今日表现
  string seal_quality_json = 18;
  repeated int32 structure_gaps = 19; // 梯队断层板位
  bool partial = 20;
  repeated string missing = 21;
  string source = 22;
  string captured_at = 23; // RFC3339
}

message ListChecksRequest {
  int32 limit = 1; // 默认 20，上限 120
}

message CheckResultRow {
  string symbol = 1;
  string name = 2;
  optional double pct = 3; // 次日涨幅 %，没取到不返回
  bool relimit = 4;        // 次日再涨停
  bool hit = 5;            // 次日收涨
}

message CheckCandidateRow {
  string symbol = 1;
  string name = 2;
  string reason = 3;
  string text = 4; // 入选逻辑摘录
}

message PredictionCheck {
  string signal_date = 1;
  string check_date = 2;
  string source = 3;
  optional int32 candidate_count = 4;
  optional int32 hit_count = 5;
  optional int32 relimit_count = 6;
  optional double hit_rate = 7; // %
  optional double avg_pct = 8;  // %
  optional double max_pct = 9;  // %
  bool partial = 10;
  repeated string missing = 11;
  repeated CheckCandidateRow candidates = 12;
  repeated CheckResultRow results = 13;
}

message PredictionCheckList {
  repeated PredictionCheck items = 1;
}

message RunCheckRequest {
  string date = 1; // YYYY-MM-DD，对账日；空为当日
}
