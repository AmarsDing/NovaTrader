syntax = "proto3";

// M02 行情与因子对内接口。桌面端经 admin 聚合访问，不直连本服务。
// 设计见 doc/开发文档/M02-行情与因子/设计文档.md 第 8 节。
package api.market.v1;

import "google/api/annotations.proto";

option go_package = "server/api/market/v1;v1";

service Market {
  // K 线。freq 为 1m 或 1d。
  rpc GetBars(GetBarsRequest) returns (GetBarsReply) {
    option (google.api.http) = {
      get: "/v1/market/bars"
    };
  }
  // 日线指标，用与实时计算相同的公式即时算出。
  rpc GetIndicators(GetIndicatorsRequest) returns (GetIndicatorsReply) {
    option (google.api.http) = {
      get: "/v1/market/indicators"
    };
  }
  // 因子截面。as_of 为空时返回内存里的实时截面；否则返回 as_of 之前最新落库的值。
  rpc GetFactorsCross(GetFactorsCrossRequest) returns (GetFactorsCrossReply) {
    option (google.api.http) = {
      get: "/v1/market/factors"
    };
  }
  // 情绪截面，as_of 规则同上。
  rpc GetSentiment(GetSentimentRequest) returns (Sentiment) {
    option (google.api.http) = {
      get: "/v1/market/sentiment"
    };
  }
  // 涨跌停列表。
  rpc GetLimitBoards(GetLimitBoardsRequest) returns (GetLimitBoardsReply) {
    option (google.api.http) = {
      get: "/v1/market/limits"
    };
  }
  // 板块热度排名。
  rpc GetSectorHeat(GetSectorHeatRequest) returns (GetSectorHeatReply) {
    option (google.api.http) = {
      get: "/v1/market/sectors"
    };
  }
  // 板块成员归属（BE-05）：给一批证券代码，返回各自当日有效的所属板块列表。
  rpc GetSectorMembership(SectorMembershipRequest) returns (SectorMembershipReply) {
    option (google.api.http) = {
      get: "/v1/market/sectors/membership"
    };
  }
  // 三大指数快照（BE-10）：上证/深成/创指，实时快照优先、缺当日快照回退最近 1d 收盘行。
  rpc GetIndexSnapshot(IndexSnapshotRequest) returns (IndexSnapshotReply) {
    option (google.api.http) = {
      get: "/v1/market/index-snapshot"
    };
  }
  // 登记候选池。同一 owner 再次登记会整体替换并续租。
  rpc SetWatchlist(SetWatchlistRequest) returns (SetWatchlistReply) {
    option (google.api.http) = {
      post: "/v1/market/watchlist"
      body: "*"
    };
  }
  // 读取候选池租约（只读）。owner 为空时返回全部未到期 owner 租约——登录即可读；单机私有部署要求各桌面互见彼此与 trade.* 进程的池（WS 不广播租约，此为本读口独有的有意暴露面）。
  rpc GetWatchlist(GetWatchlistRequest) returns (GetWatchlistReply) {
    option (google.api.http) = {
      get: "/v1/market/watchlist"
    };
  }
  // 监控驾驶舱 P1（只读）：集合竞价截面汇总——竞价总额、竞价涨停清单、抢筹前 N。
  rpc GetAuction(GetAuctionRequest) returns (GetAuctionReply) {
    option (google.api.http) = {
      get: "/v1/market/auction"
    };
  }
  // 监控驾驶舱 P1（只读）：连板梯队成功率（昨日 N 板今日封住 N+1 的比例）。
  rpc GetLadder(GetLadderRequest) returns (GetLadderReply) {
    option (google.api.http) = {
      get: "/v1/market/ladder"
    };
  }
  // 监控驾驶舱 P2（只读）：昨日涨停今日溢价快照——09:26 落开盘溢价，收盘补收盘/最高溢价。
  rpc GetLimitPremium(GetLimitPremiumRequest) returns (GetLimitPremiumReply) {
    option (google.api.http) = {
      get: "/v1/market/limit-premium"
    };
  }
  // 监控驾驶舱 P2（只读）：20 日均线上占比（市场广度快照，收盘后落库）。
  rpc GetBreadth(GetBreadthRequest) returns (GetBreadthReply) {
    option (google.api.http) = {
      get: "/v1/market/breadth"
    };
  }
  // 监控驾驶舱 P2（只读）：K 线连续性检查——交易日历开市但无日线收盘行的缺口日。
  rpc GetKlineGaps(GetKlineGapsRequest) returns (GetKlineGapsReply) {
    option (google.api.http) = {
      get: "/v1/market/kline-gaps"
    };
  }
  // 复盘体系 P0-3（只读）：盘中情绪路径——09:25 竞价头（含昨涨停竞价强度）+ 当日全部情绪截面。没存的时点不出现在 points。
  rpc GetEmotionPath(GetEmotionPathRequest) returns (GetEmotionPathReply) {
    option (google.api.http) = {
      get: "/v1/market/emotion-path"
    };
  }
  // 复盘体系 P0-4（只读）：盘中异动流水——急拉/封板/开板（引擎落 intraday_alerts），fired_at 倒序上限 200。
  rpc GetIntradayAlerts(GetIntradayAlertsRequest) returns (GetIntradayAlertsReply) {
    option (google.api.http) = {
      get: "/v1/market/intraday-alerts"
    };
  }
  // 视频落地 P0（只读）：单券快照——最新价/涨跌/当日区/五档/估值静态一次取（右行情侧栏首刷）。
  // 算不出的字段保持零值由前端显「未知」，口径与陈旧标记见 Quote 注释。
  rpc GetQuote(GetQuoteRequest) returns (Quote) {
    option (google.api.http) = {
      get: "/v1/market/quote"
    };
  }
  // 名称字典（UI 显示方案 §6.2 / 附录 B-1，只读）：证券基础信息。codes 为空返回全量，上限 6000 行。
  rpc GetSecurityBasics(GetSecurityBasicsRequest) returns (GetSecurityBasicsReply) {
    option (google.api.http) = {
      get: "/v1/market/security-basics"
    };
  }
  // 目录册增补 B2（只读）：龙虎榜席位胜率时序——lhb_seat×market_data 内部计算落 seat_stats，
  // 每席位每交易日一行 60 交易日滚动窗（T+1/T+5 胜率与收益分布），收盘后重算整批 upsert。
  rpc GetSeatStats(GetSeatStatsRequest) returns (GetSeatStatsReply) {
    option (google.api.http) = {
      get: "/v1/market/seat-stats"
    };
  }
  // 目录册增补 B3（只读）：筹码分布 CYQ——换手衰减模型纯计算（前复权日K×换手率），不落库。
  rpc GetChipDistribution(GetChipDistributionRequest) returns (GetChipDistributionReply) {
    option (google.api.http) = {
      get: "/v1/market/chip-distribution"
    };
  }
  // 目录册增补 B4（只读）：券商研报盈利预测——report_estimate 表 PIT 多券商分歧明细，
  // 发布日窗口查询（一份研报三年 1..3 行，est_year 区分预测年度）。
  rpc GetReportEstimates(GetReportEstimatesRequest) returns (GetReportEstimatesReply) {
    option (google.api.http) = {
      get: "/v1/market/report-estimates"
    };
  }

  // 批量日线（M13 W2 留账收敛，只读）：一次取回多码日线，替代按代码 HTTP 逐码拉取；
  // freq 恒 1d，POST 承载长 symbol 列表。无行的码在 results 中缺席——缺席即缺数，
  // 消费方不得补 0 行（T01 缺码整体报错语义保持不变）。
  rpc GetBarsBatch(GetBarsBatchRequest) returns (GetBarsBatchReply) {
    option (google.api.http) = {
      post: "/v1/market/bars-batch"
      body: "*"
    };
  }
  // 附录 B-2（只读）：52 周高低已由 Quote.high_52w / low_52w 携带（见 Quote 注释口径）。
  // 附录 B-3（只读）：财务排雷摘要——finance_report（业绩预告/快报/关键指标，M01 写入）。
  // 披露列全 optional：DB NULL ↔ proto 缺省；found=false = 该券无披露行，前端显「无」不告警。
  rpc GetFinanceBrief(GetFinanceBriefRequest) returns (GetFinanceBriefReply) {
    option (google.api.http) = {
      get: "/v1/market/finance-brief"
    };
  }
  // 名称/拼音联想（G2 后端先落，UI 显示方案附录 B-1 读面延展，只读）：
  // 命中通道 code 前缀 → 名称前缀 → 名称子串 → 拼音首字母前缀，四类按序归组、组内代码序；
  // 多音字取常用读音（命中错位属已知口径），match_kind 显式通道。limit ≤ 50，默认 20。
  rpc SearchSecurities(SearchSecuritiesRequest) returns (SearchSecuritiesReply) {
    option (google.api.http) = {
      get: "/v1/market/security-search"
    };
  }

  // 目录册增补 B5（只读、查询时直抓）：A/H 两地上市配对与溢价——配对走东财 F10
  // RPT_F10_BASIC_ORGINFO（24h/负 30min 进程内 TTL），三腿报价（A 现价、H 现价、
  // HKDCNY）走腾讯 qt.gtimg.cn 一次 GET；不落库、不调度、不预聚合。
  rpc GetAHPremium(GetAHPremiumRequest) returns (GetAHPremiumReply) {
    option (google.api.http) = {
      get: "/v1/market/ah-premium"
    };
  }
}

// 复权方式。NONE：价格不复权，指标为每天当时看到的值；QFQ：前复权（以区间最后一天为基准）；HFQ：后复权。
enum Adjust {
  NONE = 0;
  QFQ = 1;
  HFQ = 2;
}

message GetBarsRequest {
  string symbol = 1;
  // 1m 或 1d，默认 1d。
  string freq = 2;
  // RFC3339 或 2006-01-02，含两端。
  string start = 3;
  string end = 4;
  Adjust adjust = 5;
  // 最多返回条数，默认 1000，上限 10000。从 end 往前取。
  int32 limit = 6;
}

message Bar {
  string time = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  int64 volume = 6;
  double amount = 7;
  double adj_factor = 8;
}

message GetBarsReply {
  string symbol = 1;
  string freq = 2;
  repeated Bar bars = 3;
}

message GetIndicatorsRequest {
  string symbol = 1;
  string start = 2;
  string end = 3;
  Adjust adjust = 4;
  // 只返回这些键，空为全部。
  repeated string names = 5;
}

message IndicatorPoint {
  string time = 1;
  map<string, double> values = 2;
}

message GetIndicatorsReply {
  string symbol = 1;
  repeated IndicatorPoint points = 2;
}

message GetFactorsCrossRequest {
  // 2006-01-02，默认今天。
  string trade_date = 1;
  // RFC3339。为空取实时截面。
  string as_of = 2;
  // close / intraday / auction / capital，为空不限。
  string kind = 3;
  repeated string symbols = 4;
  repeated string names = 5;
}

message FactorRow {
  string symbol = 1;
  string as_of = 2;
  string kind = 3;
  map<string, double> values = 4;
  bool stale = 5;
}

message GetFactorsCrossReply {
  string trade_date = 1;
  repeated FactorRow rows = 2;
}

message GetSentimentRequest {
  string trade_date = 1;
  string as_of = 2;
}

message Sentiment {
  string trade_date = 1;
  string as_of = 2;
  int32 up_count = 3;
  int32 down_count = 4;
  int32 broken_count = 5;
  double broken_rate = 6;
  int32 max_height = 7;
  double profit_effect = 8;
  int32 advance = 9;
  int32 decline = 10;
  int32 flat = 11;
  double amount = 12;
  // ICE / RECOVER / WARM / HOT / FADE
  string phase = 13;
  double score_coef = 14;
  double position_scale = 15;
  bool stale = 16;
  // 风险度 0 正常 … 3 极高（与 WS market.state 同一处 Rules 计算）。
  // 只在实时截面给出；历史快照不落库该值，缺省（not present）表示未记录，0 才是真的「正常」。
  optional int32 risk_level = 17;
}

message GetLimitBoardsRequest {
  string trade_date = 1;
  // UP / DOWN，为空不限。
  string direction = 2;
  // SEALED / BROKEN，为空不限。
  string status = 3;
}

message LimitBoard {
  string symbol = 1;
  string trade_date = 2;
  string direction = 3;
  string status = 4;
  double limit_price = 5;
  string first_seal_at = 6;
  string last_seal_at = 7;
  int32 open_count = 8;
  double seal_amount = 9;
  int32 consecutive = 10;
  string as_of = 11;
  // 当日最后一次真实开板（封住→打开）的时刻；从未开板或历史数据未采集时缺省。
  // 不得用 as_of 冒充：as_of 是快照时刻，不是开板时刻。
  optional string last_break_at = 12;
}

message GetLimitBoardsReply {
  repeated LimitBoard boards = 1;
}

message GetSectorHeatRequest {
  string trade_date = 1;
  // 为空取实时排名。
  string as_of = 2;
  // 默认 50。
  int32 top = 3;
}

message SectorHeat {
  string sector_code = 1;
  string name = 2;
  int32 rank = 3;
  double heat = 4;
  double avg_pct = 5;
  int32 up_limit_count = 6;
  double advance_ratio = 7;
  double amount = 8;
  int32 member_count = 9;
  string leader_symbol = 10;
  string leader_reason = 11;
  double overseas_impulse = 12;
  string as_of = 13;
}

message GetSectorHeatReply {
  repeated SectorHeat sectors = 1;
}

message SetWatchlistRequest {
  // 登记方，例如 strategy。
  string owner = 1;
  repeated string symbols = 2;
  // 租约秒数，默认 600。
  int32 ttl_seconds = 3;
}

message SetWatchlistReply {
  int32 count = 1;
  string expires_at = 2;
}

// GetWatchlistRequest 读候选池租约：owner 过滤（如 web / trade.<uuid>）；空=全部 owner。
message GetWatchlistRequest {
  string owner = 1;
}

// WatchLease 单个 owner 的未到期租约快照。
message WatchLease {
  string owner = 1;
  repeated string symbols = 2; // 排序后的规范代码（如 600519.SH）
  string expires_at = 3; // RFC3339，与 SetWatchlistReply.expires_at 同口径
}

// GetWatchlistReply 未到期租约清单；已到期者缺席（惰性剔除，缺席即租约不存在）。
message GetWatchlistReply {
  repeated WatchLease leases = 1;
}

// GetAuctionRequest 集合竞价截面。trade_date 默认今天；数据是 09:25 落的 stock_factor(kind=auction)。
message GetAuctionRequest {
  string trade_date = 1; // 2006-01-02，空为今天
  int32 top = 2;         // 抢筹前 N（按竞价金额），默认 10，上限 50
}

// AuctionRow 一只股票的集合竞价截面。「没取到≠0」（P3-10c）：源端缺键的推导值
// （新股无昨收、无 5 日均量、无股本、无未匹配快照）改 optional 省略发送，
// 不允许折叠成 0 冒充读数；auction_amount 键恒在（源无条件落键），0=竞价无成交真值。
message AuctionRow {
  string symbol = 1;
  optional double auction_pct = 2;        // 竞价涨幅 %；源缺键不返回（0=平开真值）
  double auction_amount = 3;              // 竞价成交额（元）；键恒在，0=无成交真值
  optional double auction_vol_ratio = 4;  // 竞价量比；无 5 日均量不可算时不返回
  optional double auction_turnover = 5;   // 竞价换手 %；无股本不可算时不返回
  bool auction_limit_up = 6;              // 竞价涨停
  optional double auction_unmatched = 7;  // 未匹配量（股）；09:20-09:25 无快照不返回
}

// GetAuctionReply found=false 表示该日还没有竞价因子（非交易日或 09:26 前），total_amount 等全为 0。
message GetAuctionReply {
  string trade_date = 1;
  bool found = 2;
  double total_amount = 3;           // 全市场竞价总额（元）
  int32 limit_up_count = 4;          // 竞价涨停家数
  repeated AuctionRow limit_ups = 5; // 竞价涨停清单（按金额倒序）
  repeated AuctionRow top_rush = 6;  // 抢筹前 N（按竞价金额倒序）
  string as_of = 7;                  // 截面时刻（09:25）
}

// GetLadderRequest 连板梯队。to 默认最近一个已收盘交易日。
message GetLadderRequest {
  string to = 1; // 2006-01-02，空为今天（今天未收盘时后端回退到上一交易日）
  int32 days = 2; // 往前看几个交易日的样本，默认 5，上限 20
}

message LadderStep {
  int32 from_height = 1; // N 板
  int32 sample = 2;      // 样本：前一日收盘 N 连板家数
  int32 succeeded = 3;   // 其中次日封住 N+1 的家数
  double rate = 4;       // succeeded/sample；sample=0 时为 0，由前端写「无样本」
}

message LadderDay {
  string trade_date = 1; // 考察的「次日」
  repeated LadderStep steps = 2; // 1进2、2进3、3进4（更高的板合并进 3进4+ 不拆）
}

message GetLadderReply {
  repeated LadderDay days = 1; // 按交易日倒序
  repeated LadderStep total = 2; // 全部样本合计
}

// GetLimitPremiumRequest 昨日涨停今日溢价。trade_date 默认最近一个已收盘交易日。
message GetLimitPremiumRequest {
  string trade_date = 1; // 2006-01-02，空为今天（未收盘回退上一交易日）
  int32 days = 2; // 往前看几个交易日，默认 5，上限 20（0 为单日）
  int32 top = 3; // 明细条数上限（按 close_premium 倒序），默认 50，上限 200
}

// LimitPremiumRow 一只股票一个溢价日的快照。溢价率均为分数（0.0323 = 3.23%），分母 base_close。
message LimitPremiumRow {
  string symbol = 1;
  string name = 2;
  string trade_date = 3; // 溢价兑现日
  string base_date = 4; // 涨停日（前一交易日）
  int32 consecutive = 5; // base_date 连板数
  double base_close = 6; // base_date 收盘（涨停价）
  double open = 7;       // 开盘价；竞价口径未到时为 0
  double close = 8;      // 收盘价；未收盘为 0
  double open_premium = 9;  // 开盘溢价（竞价涨幅口径，09:26 落）
  double close_premium = 10; // 收盘溢价（收盘补）
  double high_premium = 11;  // 最高溢价（收盘补）
  bool limit_again = 12;     // 今日收盘再度涨停
  bool has_close = 13;       // close_premium 已落（false 时只有开盘口径）
  string source = 14;
}

message LimitPremiumDay {
  string trade_date = 1;
  string base_date = 2;
  int32 sample = 3; // 昨日涨停家数
  int32 limit_again = 4; // 今日收盘再度涨停家数
  optional double open_avg = 5; // 开盘溢价均值（分数）；开盘口径样本为空（竞价/快照整批缺）时不返回——「没取到≠0」
  double close_avg = 6; // 收盘溢价均值（分数）；has_close=false 时无意义，消费方先判 has_close
  double close_win = 7; // 收盘溢价 > 0 的占比（分数）；同 close_avg 的 has_close 口径
  optional double high_avg = 8; // 最高溢价均值（分数）；快照行收盘补齐前 High 全缺时不返回
  bool has_close = 9; // 当日收盘口径已落
}

// GetLimitPremiumReply found=false 表示快照表与实时兜底都拿不到（昨日无涨停名单）。
message GetLimitPremiumReply {
  string trade_date = 1;
  bool found = 2;
  bool live = 3; // true 表示快照表未落库，本行按 market_data 实时兜底
  LimitPremiumDay summary = 4;
  repeated LimitPremiumDay days = 5; // 按交易日倒序
  repeated LimitPremiumRow rows = 6; // 当日明细（按 close_premium 倒序，截断到 top）
  string as_of = 7;
}

// GetBreadthRequest 20 日均线上占比。
message GetBreadthRequest {
  string trade_date = 1; // 2006-01-02，空为最近已收盘交易日
  int32 days = 2; // 往前看几个交易日，默认 10，上限 60
}

message BreadthDay {
  string trade_date = 1;
  int32 window = 2; // 均线窗口（20）
  int32 above = 3;  // 收盘 > MA20 只数
  int32 below = 4;
  int32 flat = 5;
  int32 total = 6;  // 样本总数
  double ratio = 7; // above/total（分数）
  bool live = 8;    // true 表示 market_breadth 表无行，实时算出
  string as_of = 9;
}

message GetBreadthReply {
  string trade_date = 1;
  bool found = 2;
  BreadthDay latest = 3;
  repeated BreadthDay days = 4; // 按交易日倒序
}

// GetKlineGapsRequest K 线连续性检查。days 往前看几个交易日，默认 5，上限 20。
message GetKlineGapsRequest {
  string trade_date = 1; // 2006-01-02，空为今天
  int32 days = 2;
}

message KlineGapDay {
  string trade_date = 1;
  int32 universe = 2; // 当日应有日线收盘行的股票池大小（近 30 日有过日线的股票）
  int32 missing = 3;  // 缺口只数
  int32 present = 4;  // universe - missing
  repeated string sample = 5; // 缺口样本（按股票代码，截断到 20）
  string as_of = 6; // 最近一条缺口日线的时间；没有行时为空
}

message GetKlineGapsReply {
  string trade_date = 1;
  bool found = 2; // true 表示至少有一天有缺口
  int32 universe = 3; // 股票池大小
  repeated KlineGapDay days = 4; // 按交易日倒序
  int32 missing_total = 5; // 全部缺口日合计（重复股票按日计）
  string as_of = 7;
}


/* ---------- 复盘体系 P0-3：盘中情绪路径 ---------- */

message GetEmotionPathRequest {
  string date = 1; // YYYY-MM-DD，空为今天
}

// EmotionPathPoint 一个时点。auction=true 时只表示 09:25 竞价占位点（读数在 reply 顶层的竞价字段）。
message EmotionPathPoint {
  string time = 1;  // HH:MM
  bool auction = 2;
  int32 up = 3;           // 涨停家数
  int32 down = 4;         // 跌停家数
  int32 broken = 5;       // 炸板家数
  double broken_rate = 6; // 炸板率 %
  int32 max_height = 7;   // 最高连板
  double profit_effect = 8; // 昨涨停今平均涨幅 %
  int32 advance = 9;      // 上涨家数
  int32 decline = 10;     // 下跌家数
  double amount = 11;     // 两市成交额（元）
  string phase = 12;      // 情绪阶段 ICE/RECOVER/WARM/HOT/FADE
  double score_coef = 13; // 情绪系数
  bool stale = 14;
}

// GetEmotionPathReply partial=有块没取到；missing 列出缺的块名（auction / market_sentiment / auction_prev_tier_partial）。
message GetEmotionPathReply {
  string date = 1;
  bool auction_found = 2;
  double auction_total_amount = 3;        // 竞价总额（元）
  int32 auction_limit_up_count = 4;       // 竞价涨停家数
  optional double prev_tier_auction_pct = 5; // 昨涨停竞价平均涨幅 %，没取到不返回
  int32 prev_tier_auction_sample = 6;        // 昨涨停中有竞价截面的只数
  repeated EmotionPathPoint points = 7;
  bool partial = 8;
  repeated string missing = 9;
}

/* ---------- 复盘体系 P0-4：盘中异动流水 ---------- */

message GetIntradayAlertsRequest {
  string date = 1;     // YYYY-MM-DD，空为今天
  double min_pct = 2;  // 只保留触发幅度 pct ≥ min_pct 的行，0 为不限
  string symbols = 3;  // 逗号分隔代码，空不限
  bool watch_only = 4; // true 时叠加盯盘候选池（watch 租约：web 自选 + strategy 池）
}

// IntradayAlertRow kind∈surge/limit_up/break；pct 为急拉窗口涨幅 %（封/开板为当日涨跌幅），没取到不返回。
message IntradayAlertRow {
  string symbol = 1;
  string name = 2;
  string kind = 3;
  string time = 4; // RFC3339 触发时刻（快照时间）
  optional double pct = 5;
  optional double price = 6;
}

// GetIntradayAlertsReply 异动流水 fired_at 倒序，上限 200。当日无异动为 alerts=[]，不是错误。
message GetIntradayAlertsReply {
  string date = 1;
  repeated IntradayAlertRow alerts = 2;
}

// GetQuoteRequest 单券快照。
message GetQuoteRequest {
  string symbol = 1;
}

// QuoteLevel 一档盘口（价格 / 股数）。
message QuoteLevel {
  double price = 1;
  int64 volume = 2;
}

// Quote 单券快照。纪律：算不出的字段保持零值（前端显「未知」），不做近似填充。
// source 是价格与盘口的取值口径：snap=盘中实时快照（Redis snap:latest），1d=最近日线，""=无行情数据。
// stale 为真表示截面陈旧或快照过期规则命中；非交易时段按最近收盘口径展示不算陈旧。
// found=false 表示证券不在 stock_basic，价格区全零。
message Quote {
  string symbol = 1;
  string name = 2;
  string market = 3;         // SH / SZ / BJ
  string trade_status = 4;   // TRADE / SUSPEND
  double last = 5;           // 最新价；无行情为 0
  double chg = 6;            // last - prev_close；prev_close=0 时为 0
  double pct_chg = 7;        // 相对昨收涨跌幅 %
  double open = 8;
  double high = 9;
  double low = 10;
  double prev_close = 11;
  int64 volume = 12;         // 当日累计成交（股）
  double amount = 13;        // 当日累计成交额（元）
  double turnover_rate = 14; // 换手 %：volume / float_share；无股本数据为 0
  double amplitude = 15;     // 振幅 %：(high - low) / prev_close；prev_close=0 为 0
  repeated QuoteLevel bid = 16; // 买一至买五；快照无盘口为空（1d 口径恒为空）
  repeated QuoteLevel ask = 17; // 卖一至卖五
  double pe_ttm = 18;        // stock_basic 同步值；无数据为 0
  double pb = 19;
  double circ_mv = 20;       // 流通市值（元）：stock_basic.circ_mv，缺列且可定义计算时补 last×float_share
  double total_mv = 21;      // 总市值（元）：last × total_share；缺股本或价为 0 时为 0
  double limit_up_price = 22;   // 无涨跌幅限制（新股前五日等）为 0 且 no_limit=true
  double limit_down_price = 23;
  bool no_limit = 24;
  string source = 25;
  string as_of = 26;         // RFC3339；快照口径取行情时间与写入时间中较早者
  bool stale = 27;
  bool found = 28;
  // 近 250 交易日窗口的前复权最高/最低价（B-2）：以窗口末根 adj_factor 为基准折算；
  // 窗口有效行不足 20 或含缺因子行不可复权时不返回——「没取到≠0」。不含当日未成 K 的盘中值。
  optional double high_52w = 29;
  optional double low_52w = 30;
}

/* ---------- 名称字典（UI 显示方案 §6.2 / 附录 B-1） ---------- */

// SecurityBasic 一只证券的静态字典行。缺字段按 proto 零值（industry 无数据为空串、
// pe_ttm/pb/circ_mv 为 0），由前端字典判 hasName 显「名称未返回」，后端不伪造。
message SecurityBasic {
  string code = 1;          // 600519.SH
  string name = 2;
  string market = 3;        // SH / SZ / BJ
  string industry = 4;
  bool st_flag = 5;
  bool suspend_flag = 6;
  double pe_ttm = 7;
  double pb = 8;
  double circ_mv = 9;       // 流通市值（元）
  string update_time = 10;  // RFC3339
  repeated string concepts = 11; // 概念板块（stock_basic.concept 逗号分隔拆分；无数据为空）
  optional double total_mv = 12; // 总市值（元，stock_basic.total_mv 字典日级口径原样透传，读链不做总股本×现价推导；盘中即席口径另见 Quote.total_mv，两口径勿混）；未采集=null，「没取到≠0」
}

// GetSecurityBasicsRequest codes 为空时返回全量字典；非空按 codes（任一可解析代码写法，规整为 600519.SH）过滤。
message GetSecurityBasicsRequest {
  repeated string codes = 1;
}

// GetSecurityBasicsReply 字典行 + 版本戳 max_update_time（结果内最大 update_time，RFC3339；无结果为空），
// 供前端增量校验（§6.2 localStorage nt.secbasic.v1）。
message GetSecurityBasicsReply {
  repeated SecurityBasic list = 1;
  string max_update_time = 2;
}

// GetSeatStatsRequest 席位胜率时序。trade_date 默认最近一个已收盘交易日。
message GetSeatStatsRequest {
  string trade_date = 1; // 2006-01-02，空为今天（未收盘回退上一交易日）
  int32 top = 2;         // 席位数上限（按 sample 倒序），默认 50，上限 200
}

// SeatStatRow 一个席位一个基准日的滚动窗口胜率统计。收益率与胜率均为分数（0.0323 = 3.23%）。
// 「没取到≠0」：sample/sample_t5 是事实列（上榜次数与 T+5 已发生次数），恒有值；
// 六收益列只在有效样本（上榜日与 t+N 收盘均存在且为正）非空时返回——
// T+5 未发生（sample_t5=0）或有效样本为零的期对应三列省略发送，0 无歧义。
message SeatStatRow {
  string seat = 1;
  string as_of = 2;              // 统计基准日（窗口右端）
  int32 lookback = 3;            // 窗口交易日数（60）
  int32 sample = 4;              // 窗口内上榜次数（含 T+5 未发生）
  int32 sample_t5 = 5;           // 其中 T+5 已发生的子样本数
  optional double win_rate_t1 = 6;  // T+1 收涨占比（0-1）
  optional double avg_ret_t1 = 7;   // T+1 平均收益率
  optional double med_ret_t1 = 8;   // T+1 中位数收益率
  optional double win_rate_t5 = 9;  // T+5 收涨占比（0-1）
  optional double avg_ret_t5 = 10;  // T+5 平均收益率
  optional double med_ret_t5 = 11;  // T+5 中位数收益率
  string source = 12;
}

// GetSeatStatsReply found=false 表示该基准日 seat_stats 无行（当日龙虎榜空或任务未跑）。
message GetSeatStatsReply {
  string trade_date = 1;
  bool found = 2;
  repeated SeatStatRow rows = 3; // 按 sample 倒序、sample_t5 次之，截断到 top
  string as_of = 4;
}

// GetChipDistributionRequest 筹码分布（目录册增补 B3）。
message GetChipDistributionRequest {
  string symbol = 1;
  string as_of = 2;     // 基准日 2006-01-02，空为最近一个已收盘交易日
  int32 days = 3;       // 取数窗口（交易日）：≤0 默认 250，>400 截 400
  int32 grid_size = 4;  // 成本网格数：≤0 默认 300，合法域 50..2000（越域 400）
}

// GetChipDistributionReply 筹码分布结果。
// status 四态：ok / missing（库中无该券或窗口无日线）/ not_meaningful
// （数据不足、float_share 缺失无法算换手率、adj_factor 缺失不可复权）/ error（请求非法）。
// 「没取到≠0」：status!=ok 时价格与衍生列全部缺失（proto optional），不产假数；
// days_used/cum_turnover_pct 为事实列照常回波（非 ok 时为窗口实际入算行数）。
message GetChipDistributionReply {
  string symbol = 1;
  string status = 2;
  string reason = 3;
  optional double profit = 4;           // 获利比例（0..1，现价以下筹码占比）
  optional double avg_cost = 5;         // 加权平均成本
  optional double cost90_lo = 6;        // 90% 成本区间 [P05, P95]
  optional double cost90_hi = 7;
  optional double cost70_lo = 8;        // 70% 成本区间 [P15, P85]
  optional double cost70_hi = 9;
  optional double concentration90 = 10; // (P95−P05)/(P95+P05)
  optional double concentration70 = 11;
  optional double peak_price = 12;      // 筹码峰价（存量最大网格点）
  optional double price = 13;           // 现价 = 窗口末根前复权收盘
  int32 days_used = 14;
  double cum_turnover_pct = 15;
  string window_start = 16;
  string window_end = 17;
}

// GetReportEstimatesRequest 券商研报盈利预测（目录册增补 B4）。
message GetReportEstimatesRequest {
  string symbol = 1;
  string as_of = 2;  // 基准日 2006-01-02，空为最近一个已收盘交易日（发布日 ≤ as_of）
  int32 days = 3;    // 发布日回看窗口：≤0 默认 90，>400 截 400
}

// ReportEstimateRow 一份研报×一个预测年度的披露行（PIT：多券商分歧各自成行）。
// 「没取到≠0」：eps/pe/目标价/评级/动作等披露列源头缺披露时 DB 为 NULL，
// proto 侧全 optional 省略发送——绝不落 0 或空串冒充有披露；
// org_sname 为签发主体必有列，源头空串的行不入库（写入侧已 skip）。
message ReportEstimateRow {
  string publish_date = 1;
  string org_sname = 2;
  optional string org_code = 3;         // 东财机构码；缺披露不返回
  int32 est_year = 4;                   // 预测年度（披露年 +0/1/2）
  optional double eps = 5;              // 预测每股收益（元）
  optional double pe = 6;               // 预测市盈率（倍）
  optional double aim_price_low = 7;    // 目标价下限（元）；多数研报无目标价
  optional double aim_price_high = 8;   // 目标价上限（元）
  optional string rating = 9;           // 本次评级原文
  optional string last_rating = 10;     // 前次评级原文
  optional int32 rating_change = 11;    // 评级动作枚举（东财原样透传，无公开口径）
  optional int32 report_type = 12;      // 研报类型枚举（同上）
  optional string researcher = 13;
  optional string industry = 14;        // 东财行业名
}

// GetReportEstimatesReply found=false 表示窗口内无披露行（无覆盖券或窗口过窄），
// 与「券不存在」同视——显式缺失不编数。
message GetReportEstimatesReply {
  string symbol = 1;
  bool found = 2;
  repeated ReportEstimateRow rows = 3; // publish_date 倒序、org_sname 次之
  int32 days = 4;
  string window_start = 5; // 发布日窗口左端（as_of − days）
  string as_of = 6;        // 窗口右端（解析后基准日）
}

// ─── B5 AH 溢价（查询时直抓）────────────────────────────────────────────

// GetAHPremiumRequest symbol 必传（v1 只接 A 股代码，parseSymbol 归一）。
message GetAHPremiumRequest {
  string symbol = 1;
}

// GetAHPremiumReply status 五态：
//   ok           三腿齐备，衍生列有值；
//   no_pair      F10 证实该 A 股无 H 配对（空 data / STR_CODEH null / 非 .HK 后缀三态合一；
//                独立成态落实 empty≠source_down 纪律——同型 GetChipDistributionReply）；
//   missing      有配对但报价/汇率腿缺失（missing[] 逐腿 why 小枚举列出，衍生列缺省）；
//   pair_error   F10 配对刷新失败（含缓存过期且刷新失败）——配对未知，不产溢价数；
//   source_error 腾讯报价请求级失败（非 2xx/超时/畸形）——配对事实列仍回波。
// 三腿与衍生列 optional 指针直传：缺失=proto 缺省，不落 0/1.0（没取到≠0）。
// 逐腿显年龄：a_time/h_time/fx_time 各带**源内 tick 时刻**（RFC3339），实测三腿
// 天然不齐；停牌腿的「现价」是源的最后成交 tick、其时刻是源内最后成交时刻而非
// 取数时刻——面板必须按 tick 时刻解读该价格的新鲜度，不得当「实时新取」。
message GetAHPremiumReply {
  string status = 1; // ok / no_pair / missing / pair_error / source_error
  string reason = 2; // status≠ok 时的显式原因文案
  // 配对事实列（status≠ok 也照常回波，能查到什么给什么）
  string a_code = 3;     // "601939"
  string a_market = 4;   // "SH" / "SZ"
  string a_name = 5;     // F10 STR_NAMEA / SECURITY_NAME_ABBR 兜底
  string h_code = 6;     // "00939"（no_pair / pair_error 时为空串）
  string h_name = 7;     // F10 STR_NAMEH
  bool a_traded = 8;     // 仅当 A 腿报价在场（a_price 回波）时承载停牌语义：false=停牌/无成交，
                         // a_price=源最后成交 tick、a_time=源内最后成交时刻；
                         // A 腿缺失（status=missing）时本字段为零值 false 不代表停牌，缺失原因见 missing[]
  // 三腿报价（optional 指针直传；缺失=缺省）
  optional double a_price = 9;     // A 现价（CNY）
  optional double h_price = 10;    // H 现价（HKD）
  optional double hkdcny = 11;     // 港币兑人民币汇率
  optional double ah_ratio = 12;   // a/(h*rate)，round 4
  optional double premium_pct = 13;// (ratio-1)*100，round 2，正=A 贵，负合法不钳
  // 逐腿源内 tick 时刻（RFC3339；该腿缺失或源未给时刻则为空串）
  string a_time = 14;
  string h_time = 15;
  string fx_time = 16;
  repeated AHMissingLeg missing = 17; // 缺腿逐项（why 小枚举，面板按 why 分流告警）
  string pair_source = 18;  // 恒 "eastmoney_f10"
  string quote_source = 19; // 恒 "tencent"
  string as_of = 20;        // 服务侧合成时刻（RFC3339）
}

// AHMissingLeg 缺腿逐项：leg=a_price/h_price/hkdcny；why 为小枚举——
// no_data（响应行缺失/价格字段空串=空≠0）/ na_value（价格字段显式 "0"=无报价哨兵）
// / parse（字段在场但行或数值不可解析）。面板按 why 分流告警（数据纪律先例）。
message AHMissingLeg {
  string leg = 1;
  string why = 2;
}

// GetBarsBatchRequest 批量日线请求（M13 W2 留账）。
message GetBarsBatchRequest {
  repeated string symbols = 1; // 必传非空；任一码解析失败整批 400；>500 截 500（消费侧按 500 分包）
  string start = 2;            // 同 GetBars 时间格式；空 = 按 limit×3 自然日自 end 反推起算
  string end = 3;              // 空 = 现在；纯日期含当日
  Adjust adjust = 4;           // 各码以自身窗口末根因子为基准（与 GetBars 同口径）
  int32 limit = 5;             // 每码条数（升序取尾）；≤0 默认 250，>500 截 500
}

message SymbolBars {
  string symbol = 1;
  repeated Bar bars = 2; // 时间升序；窗口内无该码行时整个 SymbolBars 缺席（缺席即缺数）
}

message GetBarsBatchReply {
  string freq = 1; // 恒 "1d"
  repeated SymbolBars results = 2;
}

// GetFinanceBrief 附录 B-3（只读）：财务排雷摘要，报告期倒序、同期多公告按公告日倒序全列。
message GetFinanceBriefRequest {
  string symbol = 1;
  int32 periods = 2; // 最近 N 个报告期；≤0 默认 4，>12 截 12
}

message FinanceBriefRow {
  string end_date = 1;      // 报告期 YYYY-MM-DD
  string kind = 2;          // forecast / express / indicator
  string ann_date = 3;      // 公告日 YYYY-MM-DD
  string forecast_type = 4; // 预增/预减/扭亏/首亏 等；非 forecast 行为空
  optional double net_profit = 5;     // 净利润（元）；DB NULL ↔ 缺省
  optional double net_profit_yoy = 6; // 净利润同比 %；同上
  string summary = 7;
  string source = 8;
}

message GetFinanceBriefReply {
  string symbol = 1;
  bool found = 2; // false = 该券无披露行
  repeated FinanceBriefRow rows = 3;
}

// SearchSecurities G2（只读）：代码/名称/拼音联想。
message SearchSecuritiesRequest {
  string query = 1;
  int32 limit = 2; // ≤0 默认 20，>50 截 50
}

message SecurityMatch {
  string code = 1;
  string name = 2;
  string market = 3; // SH / SZ / BJ
  bool st = 4;
  bool suspended = 5;
  string match_kind = 6; // code / name / pinyin（命中通道显式，便于前端排序解释）
  string pinyin = 7;     // 名称拼音首字母串（诊断/前端高亮用）
}

message SearchSecuritiesReply {
  repeated SecurityMatch matches = 1;
}

/* ---------- BE-05 板块成员归属（stock → sector 反向查询） ---------- */

// SectorRef 一个板块引用；name 缺失时为空串（前端显代码），后端不编名。
message SectorRef {
  string code = 1;
  string name = 2;
}

// SectorMembershipRequest 批量归属查询。symbols 任一解析失败整批 400；
// 上限 200（前端持仓+候选量级远低于此），超出截断并仍正常返回。
message SectorMembershipRequest {
  repeated string symbols = 1; // 必传非空；裸码/后缀码均可，规整为 600519.SH
  string trade_date = 2;       // YYYY-MM-DD，空为今天；有效期口径 in_date ≤ 当日 < out_date
}

// SectorMembershipItem 一只证券的归属结果；sectors 为空 = 当日无有效归属（「未归属」），不是错误。
message SectorMembershipItem {
  string symbol = 1;
  repeated SectorRef sectors = 2;
}

// SectorMembershipReply items 按请求 symbols 顺序回包（含零归属券），便于前端对位。
message SectorMembershipReply {
  string trade_date = 1; // 实际生效的归属窗口日（YYYY-MM-DD）
  repeated SectorMembershipItem items = 2;
}

/* ---------- BE-10 三大指数快照 ---------- */

message IndexSnapshotRequest {}

// IndexQuote 一只指数的快照。口径与 Quote 同源：snap=盘中实时快照（Redis snap:latest，
// 仅当行情时间落在当日），1d=最近日线收盘；两边都缺 found=false、价格列零值（显式缺失，不编数）。
// as_of：snap 口径取行情时间与写入时间较早者，1d 口径取 bar 日零点；缺失为空串。
// stale：snap 陈旧或交易时段快照过期规则命中；1d 口径恒 false（收盘截面不算陈旧）。
message IndexQuote {
  string code = 1;      // 000001.SH / 399001.SZ / 399006.SZ
  string name = 2;      // 上证指数 / 深证成指 / 创业板指（与 brain 复盘口径一致的固定三只）
  double last = 3;
  double chg = 4;       // last - prev_close；prev_close=0 时为 0
  double pct_chg = 5;   // 相对昨收涨跌幅 %
  double amplitude = 6; // (high - low) / prev_close；prev_close=0 为 0
  string as_of = 7;     // RFC3339
  string source = 8;    // snap / 1d / ""
  bool stale = 9;
  bool found = 10;
}

// IndexSnapshotReply as_of = 各指数 as_of 的最大值（RFC3339；全部缺失为空串）。
// indices 恒为三只、固定顺序（上证/深成/创指），缺数靠 found=false 表达。
message IndexSnapshotReply {
  string as_of = 1;
  repeated IndexQuote indices = 2;
}
