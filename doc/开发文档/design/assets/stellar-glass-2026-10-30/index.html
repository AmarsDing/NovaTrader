<!doctype html>
<html lang="zh-CN" data-theme="dark" data-density="normal" data-visual-quality="full" data-motion="full" data-page-visibility="visible">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>NovaTrader · 星舰玻璃配置中心设计样稿</title>
  <link rel="stylesheet" href="design.css">
  <script src="prototype.js" defer></script>
</head>
<body>
  <div class="nt-design-note"><span><b>V1对照样稿</b> · 演示数据，所有交互仅在本页内存中运行</span><a href="../../assets/aether-v2-2026-10-30/index.html">查看星舰配色＋V2交互新版 ↗</a></div>
  <svg class="nt-icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="icon-display" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4M7 9h4m-4 4h8"/></symbol>
    <symbol id="icon-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/><rect x="9" y="9" width="6" height="6" rx="1"/></symbol>
    <symbol id="icon-data" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="m9 15 6-6m-5-3 2-2a5 5 0 0 1 7 7l-2 2M7 11l-2 2a5 5 0 0 0 7 7l2-2"/></symbol>
    <symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6m3-4v6l4 2"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
  </svg>
  <div class="nt-config-shell" id="app">
    <header class="nt-app-header">
      <div class="nt-brand"><span class="nt-brand-mark" aria-hidden="true">N</span><div><strong>NovaTrader</strong><span>个人量化交易终端</span></div></div>
      <span class="nt-app-section">配置中心</span>
      <div class="nt-header-actions"><span class="nt-pill">视觉方案 1.0</span><button class="nt-control nt-control-quiet" id="theme-shortcut" type="button"><svg class="nt-icon" aria-hidden="true"><use href="#icon-sun"/></svg><span>切换亮色</span></button></div>
    </header>
    <div class="nt-shell-body">
      <aside class="nt-sidebar">
        <div class="nt-sidebar-caption">配置工作面</div>
        <nav aria-label="样稿配置分类" id="navigation">
          <button class="nt-nav-item" data-view="summary" type="button" aria-current="page"><svg class="nt-icon" aria-hidden="true"><use href="#icon-grid"/></svg><span>配置概览</span></button>
          <p class="nt-nav-group">此设备</p>
          <button class="nt-nav-item" data-view="look" type="button"><svg class="nt-icon" aria-hidden="true"><use href="#icon-display"/></svg><span>外观与动效</span></button>
          <p class="nt-nav-group">接入与智能</p>
          <button class="nt-nav-item" data-view="models" type="button"><svg class="nt-icon" aria-hidden="true"><use href="#icon-chip"/></svg><span>模型服务</span><span class="nt-draft-dot" hidden aria-hidden="true"></span></button>
          <button class="nt-nav-item" data-view="datasource" type="button"><svg class="nt-icon" aria-hidden="true"><use href="#icon-data"/></svg><span>数据接口</span><span class="nt-draft-dot" hidden aria-hidden="true"></span></button>
        </nav>
        <div class="nt-sidebar-guide"><svg class="nt-icon" aria-hidden="true"><use href="#icon-shield"/></svg><strong>让变更可追溯</strong><p>先核对影响，再保存版本。<br>服务加载另看回执。</p><span class="nt-small">本样稿展示四个代表视图</span></div>
      </aside>
      <main class="nt-main" id="main">
        <div class="nt-breadcrumb">工作台<span>/</span>配置中心<span>/</span><span id="breadcrumb-current">概览</span></div>
        <div class="nt-page-heading"><div><h1 id="page-title">配置概览</h1><p id="page-description">清晰的参数分区，让每次调整都有据可查。</p></div><button class="nt-control" type="button" data-action="receipts"><svg class="nt-icon" aria-hidden="true"><use href="#icon-history"/></svg>版本与回执</button></div>
        <div class="nt-content" id="view-root"></div>
        <div class="nt-savebar" id="savebar" hidden>
          <div><strong id="dirty-text">没有未保存改动</strong><span id="base-text">演示保存版本 #42</span></div>
          <div class="nt-save-actions"><button class="nt-control" id="discard" type="button">放弃本类改动</button><button class="nt-control nt-control-primary" id="preview" type="button" disabled>预览本类变更<svg class="nt-icon" aria-hidden="true"><use href="#icon-arrow"/></svg></button></div>
        </div>
      </main>
    </div>
    <footer class="nt-app-footer"><span>星舰玻璃控制台 <span class="nt-footer-separator">/</span> 配置设计</span><span id="appearance-status">深色 · 标准 · 完整</span></footer>
  </div>
  <dialog class="nt-dialog" id="preview-dialog" aria-labelledby="preview-title">
    <div class="nt-dialog-heading"><div><span class="nt-small">演示操作 · 不会写入项目配置</span><h2 id="preview-title">核对本类变更</h2></div><button class="nt-control nt-control-quiet" type="button" data-close-dialog>关闭</button></div>
    <div id="preview-content"></div>
    <div class="nt-dialog-actions"><button class="nt-control" type="button" data-close-dialog>继续编辑</button><button class="nt-control nt-control-primary" id="confirm-save" type="button">演示保存新版本</button></div>
  </dialog>
  <dialog class="nt-dialog" id="receipts-dialog" aria-labelledby="receipts-title">
    <div class="nt-dialog-heading"><div><span class="nt-small">演示数据</span><h2 id="receipts-title">版本与服务加载回执</h2></div><button class="nt-control" type="button" data-close-dialog>关闭</button></div>
    <div class="nt-receipt-detail" id="receipts-content"></div>
  </dialog>
  <div class="nt-live-message" id="announcement" role="status" aria-live="polite"></div>
</body>
</html>
