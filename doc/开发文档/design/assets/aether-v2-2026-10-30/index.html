<!doctype html>
<html lang="zh-CN" data-theme="dark" data-density="normal" data-visual-quality="full" data-motion="full" data-visible="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>NovaTrader · Aether V2 · UI开发基准</title>
  <link rel="stylesheet" href="aether.css?rev=6">
  <link rel="stylesheet" href="galaxy-lab.css?rev=6">
  <link rel="stylesheet" href="galaxy-controls.css?rev=6">
  <link rel="stylesheet" href="galaxy-library.css?rev=6">
  <script src="galaxy-library/index.js?rev=6" defer></script>
  <script src="galaxy-preview.js?rev=6" defer></script>
  <script src="galaxy-library.js?rev=6" defer></script>
  <script src="galaxy-catalog.js?rev=6" defer></script>
  <script src="galaxy-controls.js?rev=6" defer></script>
  <script src="galaxy-lab.js?rev=6" defer></script>
  <script src="aether.js?rev=6" defer></script>
</head>
<body>
  <div class="at-document-bar"><span>交互概念 V2 <span class="at-document-divider">/</span> 演示数据 · 不连接交易服务</span><a href="../../README.md">统一UI开发规范 ↗</a></div>
  <svg class="at-symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="at-icon-workspace" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></symbol>
    <symbol id="at-icon-model" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="3"/><rect x="10" y="10" width="4" height="4" rx="1"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></symbol>
    <symbol id="at-icon-data" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7"/></symbol>
    <symbol id="at-icon-appearance" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-8 9 8 5 8-5M4 16l8 5 8-5"/></symbol>
    <symbol id="at-icon-history" viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 1 7M3 4v6h6m3-4v6l4 2"/></symbol>
    <symbol id="at-icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="at-icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="at-icon-back" viewBox="0 0 24 24"><path d="M19 12H5m5-5-5 5 5 5"/></symbol>
    <symbol id="at-icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="at-icon-motion" viewBox="0 0 24 24"><path d="M3 8h12a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h5a3 3 0 1 1-3 3"/></symbol>
    <symbol id="at-icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="at-icon-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
    <symbol id="at-icon-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="at-icon-lab" viewBox="0 0 24 24"><path d="m12 3 8 5v8l-8 5-8-5V8l8-5Zm0 9 8-4m-8 4L4 8m8 4v9M8 5l8 5"/></symbol>
  </svg>
  <div class="at-workspace" id="aether-app">
    <header class="at-topbar">
      <a class="at-brand" href="#workspace" aria-label="NovaTrader，回到工作台" data-destination="scene"><span class="at-brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><span><strong>NovaTrader</strong><small>以太 · 光场工作台</small></span></a>
      <button class="at-command-trigger at-glass" id="command-trigger" type="button"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-search"/></svg><span>查找设置与操作</span><kbd>Ctrl K</kbd></button>
      <div class="at-topbar-tools"><span class="at-preview-badge">星舰配色</span><button class="at-icon-button" id="theme-toggle" type="button" aria-label="切换亮色主题"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-sun"/></svg></button><button class="at-icon-button" id="motion-toggle" type="button" aria-label="减少动态" aria-pressed="false"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-motion"/></svg></button></div>
    </header>
    <main class="at-stage" id="stage" aria-label="配置工作区"></main>
    <div class="at-commit-rail" id="commit-rail"><span class="at-commit-status" id="commit-status">演示保存版本 #42 <span>·</span> 没有待确认改动</span><button class="at-button at-button-light" type="button" id="review-trigger" disabled>审阅变更 <svg class="at-icon" aria-hidden="true"><use href="#at-icon-arrow"/></svg></button></div>
    <nav class="at-dock at-glass" aria-label="配置工作面"><span class="at-dock-selection" aria-hidden="true"></span><button class="at-dock-item" type="button" data-destination="scene" aria-current="page"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-workspace"/></svg><span>工作台</span></button><button class="at-dock-item" type="button" data-destination="models" aria-label="模型服务"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-model"/></svg><span>模型<span class="at-dock-extra">服务</span></span><i class="at-unsaved" hidden aria-hidden="true"></i></button><button class="at-dock-item" type="button" data-destination="datasource" aria-label="数据接口"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-data"/></svg><span>数据<span class="at-dock-extra">接口</span></span><i class="at-unsaved" hidden aria-hidden="true"></i></button><button class="at-dock-item" type="button" data-destination="look" aria-label="外观与动效"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-appearance"/></svg><span>外观<span class="at-dock-extra">与动效</span></span></button><button class="at-dock-item" type="button" data-destination="lab" aria-label="组件实验室"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-lab"/></svg><span>组件<span class="at-dock-extra">实验室</span></span></button><span class="at-dock-divider"></span><button class="at-dock-item" type="button" data-action="receipts" aria-label="加载回执"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-history"/></svg><span><span class="at-dock-extra">加载</span>回执</span></button></nav>
    <footer class="at-workspace-footer"><span>对象 → 调整 → 审阅 → 确认</span><span id="preference-description">深海 · 标准 · 完整材质</span></footer>
  </div>
  <dialog class="at-dialog at-command-dialog" id="command-dialog" aria-labelledby="command-title">
    <header class="at-dialog-head"><h2 id="command-title">你想调整什么</h2><button class="at-icon-button" type="button" data-close-dialog aria-label="关闭命令面板"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-close"/></svg></button></header>
    <label class="at-command-input"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-search"/></svg><input id="command-input" type="search" placeholder="试试：模型、数据、少一点动画…" aria-label="搜索设置与操作" autocomplete="off"></label>
    <div class="at-command-results" id="command-results"></div><p class="at-command-footnote">关键词匹配 · 本地操作，不调用大模型 <kbd>Esc</kbd> 关闭</p>
  </dialog>
  <dialog class="at-dialog" id="review-dialog" aria-labelledby="review-title"><header class="at-dialog-head"><div><span class="at-eyebrow">变更托盘 · 演示</span><h2 id="review-title">确认前，再看一眼</h2></div><button class="at-icon-button" type="button" data-close-dialog aria-label="关闭变更预览"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-close"/></svg></button></header><div id="review-content"></div><footer class="at-dialog-actions" id="review-actions"></footer></dialog>
  <dialog class="at-dialog" id="receipt-dialog" aria-labelledby="receipt-title"><header class="at-dialog-head"><div><span class="at-eyebrow">演示版本与加载证据</span><h2 id="receipt-title">保存之后，仍需核验</h2></div><button class="at-icon-button" type="button" data-close-dialog aria-label="关闭回执详情"><svg class="at-icon" aria-hidden="true"><use href="#at-icon-close"/></svg></button></header><div id="receipt-content"></div></dialog>
  <div class="at-announcement" role="status" aria-live="polite" id="announcement"></div>
</body>
</html>
